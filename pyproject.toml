[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jerv-app-factory"
version = "0.1.0"
description = "Reusable validation and scaffolding pipeline for mobile apps"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
jerv = "jerv_cli:main"

[tool.setuptools]
py-modules = ["jerv_cli"]
