name: JERV Python Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Run JERV tests
        run: python -m pytest -q
